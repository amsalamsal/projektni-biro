name: Izgradnja i testovi

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruby-compat:
    # the SketchUp extension on the Ruby of older SketchUp versions: 2014-2016 (2.0), 2017-2018 (2.2),
    # 2019-2020 (2.5), 2021-2023 (2.7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.2', '2.5', '2.7'] # Ruby 2.0 (SketchUp 2014-2016): syntax checked with the parser gem in the build job
    steps:
      - uses: actions/checkout@v4
      - name: SketchUp Ruby ${{ matrix.ruby }}
        run: |
          docker run --rm -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 -v "$PWD":/w -w /w ruby:${{ matrix.ruby }} sh -c '
            set -e
            for f in $(find sketchup-site-design-pro/src -name "*.rb"); do ruby -c "$f" > /dev/null || { echo "SINTAKSA: $f"; exit 1; }; done
            echo "sintaksa u redu"
            ruby tools/compat_smoke.rb
            ruby tools/assets/check_params.rb | tail -3'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alati za testove
        run: |
          gem install minitest parser --no-document
          pip install jsonschema

      - name: Izgradnja, testovi i paketi
        run: bash tools/build_and_test.sh
        env:
          SDP_SYMBOL_PREVIEW: ${{ github.workspace }}/simboli.json
          SDP_ROAD_RENDER: ${{ github.workspace }}/ceste-pregled

      - name: AutoCAD paket
        uses: actions/upload-artifact@v4
        with:
          name: SiteDesignPro.bundle
          path: dist/SiteDesignPro.bundle/

      - name: SketchUp paket
        uses: actions/upload-artifact@v4
        with:
          name: pb_site_design_pro.rbz
          path: dist/pb_site_design_pro.rbz

      - name: Gotovi paketi na grani builds/<grana>
        if: github.event_name != 'pull_request'
        run: |
          set -e
          out=$(mktemp -d)
          cp -r dist/SiteDesignPro.bundle dist/pb_site_design_pro.rbz "$out"/
          cp simboli.json "$out"/ 2>/dev/null || true
          cp -r ceste-pregled "$out"/ 2>/dev/null || true
          cp -r shared/samples "$out"/samples
          cd "$out"
          printf 'Izgradnja %s (%s), %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" > IZGRADNJA.txt
          git init -q -b builds
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Izgradnja $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds:"builds/$GITHUB_REF_NAME"

      - name: Objava nove verzije (automatska ažuriranja)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver=$(sed -n 's:.*<Version>\([0-9.]*\)</Version>.*:\1:p' autocad-site-design-pro/Directory.Build.props)
          if gh release view "v$ver" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Verzija $ver je već objavljena."
            exit 0
          fi
          python3 tools/release.py dist izdanje
          gh release create "v$ver" izdanje/VanjskoUredjenjePRO-$ver.zip izdanje/SiteDesignPro.bundle.zip izdanje/pb_site_design_pro.rbz izdanje/latest.json \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "Vanjsko uređenje PRO $ver" --notes-file izdanje/notes.md --latest
