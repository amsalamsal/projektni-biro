name: Izgradnja i testovi

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alati za testove
        run: |
          gem install minitest parser --no-document
          pip install jsonschema

      - name: Izgradnja, testovi i paketi
        run: bash tools/build_and_test.sh

      - name: AutoCAD paket
        uses: actions/upload-artifact@v4
        with:
          name: SiteDesignPro.bundle
          path: dist/SiteDesignPro.bundle/

      - name: SketchUp paket
        uses: actions/upload-artifact@v4
        with:
          name: pb_site_design_pro.rbz
          path: dist/pb_site_design_pro.rbz

      - name: Gotovi paketi na grani builds/<grana>
        if: github.event_name != 'pull_request'
        run: |
          set -e
          out=$(mktemp -d)
          cp -r dist/SiteDesignPro.bundle dist/pb_site_design_pro.rbz "$out"/
          cd "$out"
          printf 'Izgradnja %s (%s), %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" > IZGRADNJA.txt
          git init -q -b builds
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Izgradnja $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds:"builds/$GITHUB_REF_NAME"
