<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Vanjsko uređenje PRO – biblioteka 3D modela</title>
<link rel="stylesheet" href="sdp.css">
<style>
  .layout { display: grid; grid-template-columns: 220px 1fr 330px; gap: 12px; height: calc(100vh - 150px); }
  .cats { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: auto; }
  .cats button { display: flex; width: 100%; justify-content: space-between; gap: 6px; border: none; border-bottom: 1px solid #f0f0f0;
    border-radius: 0; text-align: left; padding: 7px 10px; background: transparent; }
  .cats button.active { background: #e8f0fb; color: var(--accent-dark); font-weight: 600; }
  .cats .n { color: var(--muted); font-weight: 400; }
  .browse { display: flex; flex-direction: column; min-width: 0; }
  .grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; }
  .asset { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px; cursor: pointer; text-align: left; font: inherit; color: var(--text); }
  .asset:hover { border-color: #b5b5b5; }
  .asset.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(26, 111, 196, .25); }
  .asset img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f4f5f2; border-radius: 2px; display: block; }
  .asset .t { font-size: 12px; margin: 4px 2px 0; line-height: 1.25; }
  .asset .mono { margin: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: auto; padding: 10px 12px; }
  .detail img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f4f5f2; border-radius: 3px; }
  .detail h2 { font-size: 14px; margin: 8px 0 2px; }
  .meta { width: 100%; font-size: 12px; margin: 8px 0; }
  .meta td { padding: 3px 4px; border-bottom: 1px solid #f0f0f0; }
  .meta td:first-child { color: var(--muted); width: 38%; }
  .param { grid-template-columns: 1fr 120px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .msg { padding: 6px 8px; border-radius: 3px; margin-top: 8px; font-size: 12px; }
  .msg.error { background: #fdecea; color: var(--error); } .msg.warning { background: #fff4e0; color: var(--warning); } .msg.ok { background: #e6f4ea; color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 8px; }
  .chips button { padding: 2px 9px; font-size: 12px; border-radius: 12px; }
  .chips button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Biblioteka 3D modela</h1>
  <div class="sub">Lokalna biblioteka (bez interneta): odaberite kategoriju, model i parametre, pa umetnite klikom u model ili zamijenite odabrani element. ID modela = naziv AutoCAD bloka.</div>
</header>
<main>
  <div class="layout">
    <nav class="cats" id="cats"></nav>
    <section class="browse">
      <div class="row">
        <input type="search" id="search" placeholder="Pretraga (naziv, ID, podkategorija)" style="flex:1">
        <label><input type="checkbox" id="onlyModel"> U ovom modelu</label>
      </div>
      <div class="chips" id="subs"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="detail" id="detail"><div class="empty">Odaberite model.</div></aside>
  </div>
</main>
<footer>
  <span class="note" id="note"></span>
  <button id="close">Zatvori</button>
</footer>
<script src="sdp.js"></script>
<script>
(function () {
  'use strict';
  var $ = sdp.$, esc = sdp.esc, data = null, folder = null, sub = '', current = null, details = null;
  var GEOM = { point: 'tačkasti (umetanje klikom)', path: 'linijski (trasa)', polygon: 'površinski (kontura)' };
  var UNITS = { length: 'm', angle: '°' };

  function asset(id) { return data.assets.filter(function (a) { return a.assetId === id; })[0]; }

  function visible() {
    var q = $('#search').value.toLowerCase();
    return data.assets.filter(function (a) {
      return (!folder || q || a.folder === folder) && (!sub || q || a.subcategory === sub) && (!$('#onlyModel').checked || a.inModel) &&
        (!q || (a.name + ' ' + (a.nameEn || '') + ' ' + a.assetId + ' ' + (a.subcategory || '')).toLowerCase().indexOf(q) >= 0);
    });
  }

  function renderCats() {
    $('#cats').innerHTML = data.folders.map(function (f) {
      return '<button data-folder="' + esc(f.id) + '" class="' + (f.id === folder ? 'active' : '') + '"><span>' + esc(f.name) + '</span><span class="n">' + f.count + '</span></button>';
    }).join('');
    var subs = [];
    data.assets.forEach(function (a) { if (a.folder === folder && a.subcategory && subs.indexOf(a.subcategory) < 0) { subs.push(a.subcategory); } });
    $('#subs').innerHTML = '<button data-sub="" class="' + (sub ? '' : 'active') + '">Sve</button>' + subs.sort().map(function (s) {
      return '<button data-sub="' + esc(s) + '" class="' + (s === sub ? 'active' : '') + '">' + esc(s) + '</button>';
    }).join('');
  }

  function renderGrid() {
    var rows = visible();
    $('#grid').innerHTML = rows.map(function (a) {
      return '<button class="asset' + (a.assetId === current ? ' active' : '') + '" data-id="' + esc(a.assetId) + '">' +
        '<img loading="lazy" alt="" src="' + esc(a.preview) + '"><div class="t">' + esc(a.name) + '</div><div class="mono">' + esc(a.assetId) + '</div></button>';
    }).join('') || '<div class="empty">Nema modela koji odgovaraju izboru.</div>';
    $('#note').textContent = rows.length + ' prikazano · ukupno ' + data.assets.length + ' modela u 14 kategorija' +
      (data.missing && data.missing.length ? ' · NEDOSTAJU datoteke: ' + data.missing.join(', ') : '');
  }

  function fieldFor(p) {
    var v = p['default'], id = 'p_' + p.key, lab = esc(p.label || p.key);
    var input;
    if (p.type === 'bool') {
      input = '<input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '>';
    } else if (p.type === 'enum') {
      input = '<select id="' + id + '">' + (p.options || []).map(function (o) {
        var l = (details.optionLabels || {})[o] || o;
        return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(l) + '</option>';
      }).join('') + '</select>';
    } else if (p.type === 'material') {
      input = '<select id="' + id + '">' + details.materials.map(function (m) {
        return '<option value="' + esc(m.key) + '"' + (m.key === v ? ' selected' : '') + '>' + esc(m.name) + '</option>';
      }).join('') + '</select>';
    } else if (p.type === 'length' || p.type === 'number' || p.type === 'angle' || p.type === 'integer') {
      input = '<input type="number" step="any" id="' + id + '" value="' + (v === null || v === undefined ? '' : esc(v)) + '"' +
        (p.min !== undefined && p.min !== null ? ' min="' + p.min + '"' : '') + (p.max !== undefined && p.max !== null ? ' max="' + p.max + '"' : '') + '>';
    } else {
      input = '<input type="text" id="' + id + '" value="' + esc(v === null || v === undefined ? '' : v) + '">';
    }
    return '<div class="param"><label for="' + id + '">' + lab + (UNITS[p.type] ? ' (' + UNITS[p.type] + ')' : '') + '</label>' + input + '</div>';
  }

  function renderDetail(message) {
    var a = asset(current);
    if (!a) { $('#detail').innerHTML = '<div class="empty">Odaberite model.</div>'; return; }
    var d = a.dimensions || {};
    var html = '<img alt="" src="' + esc(a.preview) + '"><h2>' + esc(a.name) + '</h2><div class="mono">' + esc(a.assetId) + '</div>' +
      '<table class="meta">' +
      '<tr><td>Kategorija</td><td>' + esc(a.category) + ' / ' + esc(a.subcategory) + '</td></tr>' +
      '<tr><td>Vrsta</td><td>' + esc(GEOM[a.geometry] || a.geometry) + '</td></tr>' +
      '<tr><td>Dimenzije uzorka</td><td>' + sdp.fmt(d.x, 2) + ' × ' + sdp.fmt(d.y, 2) + ' × ' + sdp.fmt(d.z, 2) + ' m' + (d.zMin < 0 ? ' (ispod terena do ' + sdp.fmt(d.zMin, 2) + ' m)' : '') + '</td></tr>' +
      '<tr><td>AutoCAD blok</td><td class="mono">' + esc(a.assetId) + '</td></tr>' +
      '<tr><td>Model</td><td>' + (a.kind === 'custom' ? 'vlastiti detaljni model' : a.kind === 'parametric' ? 'parametarska površina/trasa s teksturom' : 'generički prikaz') + '</td></tr>' +
      '<tr><td>Status</td><td>' + sdp.badge(a.hasModel ? 'create' : 'error', a.hasModel ? a.statusBs : 'Datoteka modela nedostaje') + '</td></tr>' +
      '<tr><td>Izvor</td><td>' + esc(a.source) + '</td></tr>' +
      '<tr><td>Licenca</td><td>' + esc(a.license) + '</td></tr>' +
      '<tr><td>Materijali</td><td class="mono">' + esc((a.materials || []).join(', ')) + '</td></tr>' +
      (a.inModel ? '<tr><td>U ovom modelu</td><td>' + a.inModel + ' <button class="small" id="selectType">Odaberi</button></td></tr>' : '') +
      '</table>';
    if (details && details.id === current) {
      if (details.geometry !== 'point') {
        html += '<div class="params"><h3>' + (details.geometry === 'path' ? 'Trasa' : 'Kontura') + '</h3>' +
          '<div class="muted" style="font-size:12px">Ako su odabrane ivice (trasa) ili lice (kontura), model se izrađuje na njima; inače se klikom umeće uzorak zadane veličine.</div>' +
          (details.geometry === 'path'
            ? '<div class="param"><label for="s_length">Dužina (m)</label><input type="number" step="any" min="0.1" id="s_length" value="6"></div>'
            : '<div class="param"><label for="s_width">Širina (m)</label><input type="number" step="any" min="0.1" id="s_width" value="4"></div>' +
              '<div class="param"><label for="s_depth">Dubina (m)</label><input type="number" step="any" min="0.1" id="s_depth" value="3"></div>') + '</div>';
      }
      html += '<div class="params"><h3>Parametri</h3>' + details.parameters.map(fieldFor).join('') + '</div>';
    } else {
      html += '<div class="muted">Učitavanje parametara…</div>';
    }
    html += '<div class="actions"><button class="primary" id="insert"' + (a.hasModel ? '' : ' disabled') + '>Umetni u model</button>' +
      '<button id="replace">Zamijeni odabrano</button><button id="importDae">Uvezi DAE</button><button id="openFolder">Otvori folder</button></div>';
    if (message) { html += '<div class="msg ' + esc(message.kind) + '">' + esc(message.text) + '</div>'; }
    $('#detail').innerHTML = html;
  }

  function collectParams() {
    var out = {};
    (details && details.id === current ? details.parameters : []).forEach(function (p) {
      var el = $('#p_' + p.key);
      if (!el) { return; }
      var v;
      if (p.type === 'bool') { v = el.checked; } else if (el.type === 'number') { v = el.value === '' ? null : parseFloat(el.value); } else { v = el.value; }
      if (v !== null && v !== p['default'] && !(typeof v === 'number' && isNaN(v))) { out[p.key] = v; }
    });
    return out;
  }

  function shape() {
    var s = {};
    ['length', 'width', 'depth'].forEach(function (k) { var el = $('#s_' + k); if (el && el.value) { s[k] = parseFloat(el.value); } });
    return s;
  }

  function select(id) {
    current = id;
    details = null;
    renderGrid();
    renderDetail();
    sdp.call('details', { id: id });
  }

  sdp.render = function (d) {
    if (d.mode === 'details') { details = d; renderDetail(); return; }
    if (d.mode === 'message') { renderDetail({ kind: d.kind, text: d.text }); return; }
    data = d;
    if (!folder && d.folders.length) { folder = d.folders[0].id; }
    renderCats();
    renderGrid();
    if (current) { renderDetail(); }
  };

  $('#cats').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    folder = b.dataset.folder; sub = ''; $('#search').value = '';
    renderCats(); renderGrid();
  });
  $('#subs').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    sub = b.dataset.sub; renderCats(); renderGrid();
  });
  $('#grid').addEventListener('click', function (e) {
    var b = e.target.closest('.asset');
    if (b) { select(b.dataset.id); }
  });
  $('#detail').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !current) { return; }
    if (b.id === 'insert') { sdp.call('insert', { id: current, params: collectParams(), shape: shape() }); }
    if (b.id === 'replace') { sdp.call('replace', { id: current, params: collectParams() }); }
    if (b.id === 'importDae') { sdp.call('importDae', { id: current }); }
    if (b.id === 'openFolder') { sdp.call('openFolder', { id: current }); }
    if (b.id === 'selectType') { sdp.call('selectType', { id: current }); }
  });
  $('#search').addEventListener('input', renderGrid);
  $('#onlyModel').addEventListener('change', renderGrid);
  $('#close').addEventListener('click', function () { sdp.call('close'); });
})();
</script>
</body>
</html>
